# Amendment arm: evoked_erp_core_ica_rank_matched — the ICA dimensionality control.
#
# WHY THIS EXISTS AS A SEPARATE CONFIG
#
# evoked_erp_core.yaml lists ica_rank_matched under comparators.secondary. The evoked
# runner builds its method list from methods_under_test + comparators.required only, so
# secondary comparators are never executed. The result is the last comparator in the
# campaign that is declared, registered, and absent from its arm's table with no
# recorded reason -- unlike xdawn, whose exclusion the parent config explains.
#
# Editing the parent config to promote it would change config_hash
# b772f29ebe7fa3d20479fea5de7c57e17f821450c5e3374543a2b82a7805fc71 and orphan the 120
# attempts recorded against it. This amendment therefore carries its own hash; the
# parent arm and its results are untouched.
#
# WHY IT MATTERS MORE THAN A MISSING TICKBOX
#
# ica_rank_matched is rank-k ICA fitted on TRAIN and reconstructed on EVAL with NO
# component removed. It removes no artifact; it only passes the data through a
# k-dimensional bottleneck. It is therefore the negative control for the arm's central
# claim: if DSS's effect on the held-out contrast were an artifact of rank reduction
# rather than of the trial-average bias, this control would reproduce it. The paper
# argues DSS enhances reproducibility without enhancing discriminability, and that
# argument is stronger with the dimensionality control reported than without it.
#
# RANK MATCHING
#
# k is left at the adapter default of 5, which is exactly what rank_matched_pca used in
# the parent arm: the parent's sweep block keys on `dss` only, so the PCA control also
# ran at its default. Matching the PCA control is the point -- same rank, same
# train-only fit scope, PCA replaced by ICA. Setting k to anything else here would
# break the comparison it exists to make. No sweep, for the same reason.

arm: evoked_erp_core_ica_rank_matched
runner: evoked
status: amendment
amends: evoked_erp_core
amends_config_sha256: b772f29ebe7fa3d20479fea5de7c57e17f821450c5e3374543a2b82a7805fc71

dataset:
  id: erp_core_n170
  project_relative_path: osf/erp-core/n170
  version: osf_thsqg_snapshot_manifest
  subjects: manifest_subjects
  excluded_subjects: []
  channel_types: [eeg]
  eog_channels: [HEOG_left, HEOG_right, VEOG_lower]

# The control is the method under test here; none is the reference level so the
# contrast is readable without cross-referencing the parent table.
methods_under_test: [ica_rank_matched]
comparators:
  required: [none]

splits: {fit: train_runs_or_trials, selection: validation, evaluation: held_out_trials}
trial_handling: {match_trial_counts: true, report_native_and_matched: true}

metrics:
  primary_target: held_out_face_minus_car_N170_effect_size
  primary_preservation: N170_mean_amplitude_topography_equivalence
  roi_channels: [PO7, PO8]            # ERP-CORE N170 canonical electrodes (Kappenman 2021)
  secondary: [SME, split_half_reliability, rank_change]

equivalence_margin: {value: 0.5, scale: within_subject_raw_split_sd, direction: two_sided_equivalence, justification: inherited_unchanged_from_parent_arm_so_the_control_is_judged_on_the_same_scale}

unit_of_inference: subject
seeds: {global: 42, ica: 42}
storage: {always_save: [metrics, model_json, terminal_status, provenance]}

# Identical to the parent arm. The branch point and exclusions must match or the
# control is measured against a differently preprocessed baseline.
baseline_preprocessing:
  source: "Kappenman et al. 2021 (10.1016/j.neuroimage.2020.117465)"
  mains_hz: 60
  online_reference: CMS_DRL
  steps:
    resample_hz: 256
    offline_reference: average_all_33
    n170_window_ms: [110, 150]
    highpass_hz: 0.1
    bipolar_eog: true
    epoch_ms: [-200, 800]
    baseline_ms: [-200, 0]
  branch_point: common_epoched_erp
  excluded_from_baseline: [ica_ocular]
