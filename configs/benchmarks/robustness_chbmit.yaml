# Arm: robustness_chbmit — multichannel clinical ASR robustness (CHB-MIT, 23 bipolar EEG, ~1-h records).
arm: robustness_chbmit
runner: robustness
status: active
dataset: {id: chbmit, project_relative_path: physionet/chbmit, channel_types: [eeg]}
methods_under_test: [asr, rasr]
comparators: {required: [none]}
sweep: {asr: {param: cutoff, grid: [10, 20, 30, 50]}}   # ASR cutoff sweep x {asr, rasr} (was fixed k=20); tests "needs re-tuning" (MF5)
metrics: {primary_target: effective_rank_change}
unit_of_inference: recording
seeds: {global: 42}
baseline_preprocessing: {source: "CHB-MIT scalp seizure EEG; 23 bipolar 10-20, 256 Hz", steps: {highpass_hz: 1.0, lowpass_hz: 40.0}}
storage: {always_save: [metrics, model_json, terminal_status, provenance]}
