# Arm: line_injection — controlled 50/60-Hz injection with a KNOWN clean target.
# Skeleton (P0). Fields marked pending_feasibility/pending are rejected by the submission validator
# until frozen. See docs/benchmarks/BENCHMARK_PLAN.md and ANALYSIS_PLAN.md.
arm: line_injection
runner: line_noise
status: not_started

source:
  base: forward_model            # synthetic / forward-model line-FREE base (clean target = X_base)
  inject: L_known                # X_test = X_base + L_known
  line_freq_hz: [50, 60]
  harmonics_hz: pending          # only < Nyquist; exclude any HPI region
  conditions: [stationary, freq_drift, amp_drift, low_rank, high_rank, near_oscillation, intermittent]
  snr_levels_db: pending
  seeds: {global: 42, n_replicates: pending}

methods_under_test: [zapline, zapline_plus]
comparators:
  required: [none, notch]
  required_comparator_group:
    non_spatial_line_noise:
      preferred: cleanline
      accepted_substitutes: [sinusoid_regression, spectrum_interpolation]
  optional: []

sweep:                            # aggressiveness param → attenuation–preservation curve
  zapline: {param: n_remove, grid: pending}

psd_spec:                         # frozen so spectral metrics are reproducible
  estimator: welch
  window: hann
  nperseg: pending
  noverlap: pending
  resolution_hz: pending
  center_bin_hz: pending
  sideband_hz: pending
  harmonic_aggregation: pending
  channel_aggregation: [geometric_mean, per_channel_distribution]
  drift_handling: pending

guards:                           # programmatic (enforced by runner)
  no_lowpass_below_highest_harmonic: true
  no_resample_before_line_eval: true
  no_cleaner_before_branch: true
  identical_input_across_methods: true

metrics:
  primary_target: residual_projection_onto_L_known
  primary_preservation: off_target_waveform_spectral_equivalence
  secondary: [removed_signal_similarity_to_L_known, sideband_distortion, phase_distortion, ringing, rank_change, tf_recovery]
preservation_reference:
  source: known_pre_injection_base
  construction: X_base (line-free synthetic / forward-model)
  independent_from_method_fit: true
equivalence_margin: {value: pending_feasibility, direction: non_inferiority, justification: pending}

storage:
  always_save: [metrics, model_json, qc_arrays, removed_signal]
  save_cleaned: {mode: selected_replicates, ids: pending}

baseline_preprocessing:   # paper-grounded; see docs/benchmarks/PREPROCESSING.md
  source: "synthetic forward-model base + known L_known"
  mains_hz: [50, 60]                 # both injected
  steps:
    clean_forward_base: true         # known pre-injection signal is the reference
    inject_L_known: true
  branch_point: "X_test = X_base + L_known"
  excluded_from_baseline: [any_cleaning_before_branch]
