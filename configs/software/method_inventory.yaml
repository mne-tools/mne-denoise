schema_version: 1
inventory_id: neuroimage_0.1_method_inventory
integration_commit: 40322136ba932d08b3616a319d60421772f9295f
generated_from:
  base_branch: origin/benchmark/compute-canada
  base_commit: 0abb149
  integration_branch: codex/neuroimage-0.1-integration
status_definitions:
  released_estimator: public API inherited from the working package baseline
  release_candidate_estimator: public API integrated for the 0.1 release candidate
  experimental_estimator: public experimental API; no release-grade efficacy claim
  native_operator: public target or contrast used by a native estimator
  benchmark_comparator: evaluation-layer implementation, not a package efficacy claim
  license_isolated_comparator: comparator excluded from the BSD wheel
evidence_tiers:
  E0: implementation only
  E1: unit and invariant tests
  E2: external numerical, behavioral, or subspace parity evidence
  E3-dev: intended-regime development evidence; frozen rerun not yet complete
  E4: completed frozen intended-regime validation

methods:
  - id: dss
    family: target_aware_dss
    status: released_estimator
    target: covariance structure specified by a linear bias operator
    information_access: blind or target-informed, depending on bias
    import_path: mne_denoise.dss.DSS
    source: origin/benchmark/compute-canada@0abb149 plus integration adaptations@40322136
    fit_scope: transferable fit or recording-local segmented fit
    fitted_state: [filters_, patterns_, eigenvalues_, n_selected_, segment_results_]
    invariant_tests: [tests/test_linear_dss.py, tests/test_adaptive_dss.py, tests/test_multimodal_whitening.py]
    external_parity: MATLAB DSS fixtures exist; runtime-dependent tests remain explicit skips when MATLAB is unavailable
    intended_benchmark: ERP CORE N170, ds000117 M170, Tsinghua/BETA SSVEP, line and artifact regimes
    evidence_tier: E3-dev
    benchmark_state: frozen_protocol_ready_rerun_required
    optional_dependencies: []
    license: BSD-3-Clause

  - id: iterative_dss
    family: target_aware_dss
    status: released_estimator
    target: nonlinear source contrast
    information_access: blind, contrast-selected
    import_path: mne_denoise.dss.IterativeDSS
    source: origin/benchmark/compute-canada@0abb149 plus symmetric-orientation fix@40322136
    fit_scope: transferable fit
    fitted_state: [filters_, patterns_, components_, scores_]
    invariant_tests: [tests/test_iterative_dss.py, tests/denoisers]
    external_parity: sign/permutation-aware source validation; no universal waveform identity claim
    intended_benchmark: expanded factorial BSS known-source recovery
    evidence_tier: E4
    benchmark_state: generic_bss_factorial_complete_forward_mixing_pending
    optional_dependencies: []
    license: BSD-3-Clause

  - id: zapline
    family: line_periodic
    status: released_estimator
    target: narrowband spatial line field
    information_access: blind target-frequency informed
    import_path: mne_denoise.zapline.ZapLine
