    fit_scope: recording-local
    fitted_state: [filters_, patterns_, eigenvalues_, n_removed_]
    invariant_tests: [tests/test_zapline.py, tests/parity/test_zapline_parity.py]
    external_parity: MATLAB fixture tests are retained and explicitly skip without MATLAB
    intended_benchmark: known-field line injection and multi-system real line noise
    evidence_tier: E3-dev
    benchmark_state: frozen_protocol_ready_rerun_required
    optional_dependencies: []
    license: BSD-3-Clause

  - id: zapline_plus
    family: line_periodic
    status: released_estimator
    target: nonstationary narrowband spatial line field
    information_access: blind with automatic frequency and segment selection
    import_path: mne_denoise.zapline.ZapLine
    configuration: {adaptive: true}
    source: origin/benchmark/compute-canada@0abb149 and adaptive segmentation from origin/feature/adaptive-dss@c7fab2f
    fit_scope: recording-local segmented fit
    fitted_state: [segment_results_, detected_freqs_, qa_results_]
    invariant_tests: [tests/test_zapline_adaptive.py, tests/test_adaptive_dss.py]
    external_parity: behavioral validation against published ZapLine-plus operating logic
    intended_benchmark: line strength, spatial rank, harmonic, amplitude-drift, and frequency-drift campaign
    evidence_tier: E3-dev
    benchmark_state: frozen_protocol_ready_rerun_required
    optional_dependencies: []
    license: BSD-3-Clause

  - id: asr_standard_and_riemannian
