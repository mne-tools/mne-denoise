      public_halt_trial_count: 9224
      paper_reported_trial_count: 9224
      public_subjects: [A, B, C, E, F, G, H, I, J, K, L, M]
      absent_halt_subject: D
      feature_layout: full_19_by_19_Pearson_correlation_matrix
      paper_analysis_code_public: false
      source_underspecified:
