studies:
  chang_2020:
    citation:
      doi: 10.1109/TBME.2019.2930186
      title: Evaluation of Artifact Subspace Reconstruction for Automatic Artifact Components Removal in Multi-Channel EEG Recordings
    implementation: standard
    source_oracle:
      repository: https://github.com/sccn/clean_rawdata
      audited_commit: d4b143f2a7719cf12d46c9b3e15aa827edb05614
    original_data:
      description: 20 recordings from 10 participants in a 90-minute simulated-driving experiment
      public: false
      status: blocked_external
    preprocessing:
      acquisition_sfreq_hz: 500
      bandpass_hz: [0.5, 100.0]
      analysis_sfreq_hz: 250
      flatline_s: 5
      line_noise_sd: 4
      channel_correlation: 0.8
    calibration:
      window_s: 1.0
      z_tolerances: [-3.5, 5.5]
      max_bad_channel_fraction: 0.075
    processing:
      window_s: 0.5
      step_s: 0.25
      cutoffs: [1, 2.5, 3, 5, 10, 20, 30, 40, 50, 70, 100, 200, 500, 1000]
    endpoints:
      - modified_sample_fraction
      - variance_reduction_fraction
      - matched_ic_scalp_map_correlation
      - retained_iclabel_class_power
      - dipolar_component_fraction_rv_lt_0.05
    evidence:
      algorithm: exact_numerical
      published_dataset_result: result_pattern

  blum_2019:
    citation:
      doi: 10.3389/fnhum.2019.00141
      title: A Riemannian Modification of Artifact Subspace Reconstruction for EEG Artifact Handling
    implementation: riemannian_windowed
    source_oracle:
      repository: https://github.com/s4rify/rASRMatlab
      audited_commit: 0e1ead42028bf18d023e9ace96e234ca12afd437
    original_data:
      description: 27 participants, 24-channel indoor/outdoor standing and walking EEG
      public: false
      status: blocked_external
    preprocessing:
      sfreq_hz: 250
      lowpass_hz: 40.0
      lowpass_fir_order: 166
      highpass_hz: 0.25
      highpass_fir_order: 3300
      calibration: one-minute rest at the start of each block
    reference_parameters:
      standard:
        flatline_s: 5
        highpass_transition_hz: [0.25, 0.95]
        channel_correlation: 0.9
        line_noise_sd: 3
        burst_cutoff: 5
        window_rejection: 0.5
        stepsize: 32
        max_dims: 0.66
      riemannian:
        flatline_s: 1
        highpass_transition_hz: [0.25, 0.95]
        channel_correlation: disabled
        line_noise_sd: disabled
        burst_cutoff: 1
        window_rejection: 0.3
        stepsize: 16
        max_dims: 1.0
    endpoints: [blink_sensitivity, vep_specificity, vep_snr, vep_amplitude, runtime]
    evidence:
      original_rasr_backend: exact_numerical
      production_windowed_backend: algorithmic
      published_dataset_result: result_pattern

  anders_2020:
    citation:
      doi: 10.1007/s11517-020-02252-3
      title: The influence of motor tasks and cut-off parameter selection on artifact subspace reconstruction in EEG recordings
    implementation: standard
    original_data:
      description: cognitive task, single-leg stance, and fast walking EEG
      public: false
      status: blocked_external
    preprocessing:
      average_reference: true
      analysis_sfreq_hz: 250
      channel_correlation: 0.85
      line_noise_sd: 4
      max_reconstructed_channel_fraction: 0.25
    processing:
      cutoffs: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]
    endpoints:
      - removed_or_reconstructed_fraction
      - relica_reproducibility
      - dipolarity
      - automated_brain_component_count
    evidence:
      published_dataset_result: result_pattern

  richer_2020:
    citation:
      doi: 10.1109/TNSRE.2020.3000971
      title: Motion and Muscle Artifact Removal Validation Using an Electrical Head Phantom, Robotic Motion Platform, and Dual Layer Mobile EEG
    implementation: standard
    original_data:
      public: false
      status: blocked_external
      note: ds004784 is the later Downey and Ferris 2023 phantom, not the Richer 2020 cohort
      walking_speeds_m_per_s: [0.5, 1.0, 1.5, 2.0]
      muscle_amplitudes_uv: [0, 100, 300, 500]
    preprocessing:
      asr_cutoffs: [3, 10, 20, 50]
      post_asr_decomposition: independent_component_analysis
    endpoints:
      - gait_cycle_time_frequency_relative_error_8_to_30_hz
      - ground_truth_source_recovery_after_ica
    evidence:
      published_dataset_result: result_pattern
      exact_data_replication: blocked_external

  downey_ferris_2023:
    citation:
      doi: 10.3390/s23198214
      title: iCanClean Removes Motion, Muscle, Eye, and Line-Noise Artifacts from Phantom EEG
    implementation: standard
    original_data:
      doi: 10.18112/openneuro.ds004784.v1.0.4
      public: true
      status: available
      conditions: [clean, eyes, jaw, motion, neck, all_artifacts]
      technical_repeats: [1, 2]
    published_protocol:
      preprocessing: released_1Hz_highpass_no_rereference_no_channel_rejection_512Hz
      calibration: [external_clean_recording, target_clean_window_selection]
      cutoff_grid: [1_to_10_by_0.05, 10.5_to_25_by_0.5, 26_to_250_by_1]
      expected_cutoff_count: 436
      protocol: configs/benchmarks/asr_ds004784_replication.yaml
      freeze_manifest: configs/protocols/asr_ds004784_replication_v2.freeze.json
      prior_freeze_manifest: configs/protocols/asr_ds004784_replication_v1.freeze.json
      revision_reason: restore_published_clean_rawdata_reference_window_tolerances
      distributed_reference_manifest: configs/manifests/ds004784_asr_published_references.json
    split:
      published_procedural_replication: technical_repeat_1
      locked_family_replication: technical_repeat_2
    endpoints:
      - corrected_ground_truth_data_quality_score
      - ground_truth_preservation_correction
      - clean_waveform_error
      - clean_waveform_correlation
      - signal_power_retention
    evidence:
      published_dataset_result: exact_reference_cells_and_distributed_waveforms
      locked_family_result: configured_not_executed

  tsai_2023:
    citation:
      doi: 10.1109/TNNLS.2022.3174528
      title: Development of an Adaptive Artifact Subspace Reconstruction Based on Hebbian/Anti-Hebbian Learning Networks for Enhancing BCI Performance
    implementations:
      - standard
      - adaptive_mw_final_state
      - adaptive_psp
      - adaptive_psw
    source_oracle:
      repository: https://github.com/t5i0m7/AASR
      audited_commit: 9f0e7365984d6cc47f034cdb8ef8121d4339d97b
    algorithm_parity:
      variants: [adaptive_psp, adaptive_psw]
      contamination_levels: [moderate, strong]
      update_counts: [1, 3]
      cleaned_relative_error_max: 1.0e-5
      state_relative_error_max: 1.0e-4
      test: tests/parity/test_aasr_parity.py
      status: exact_numerical
    benchmark_data:
      public_raw_dataset_doi: 10.17632/wb6yvr725d.4
      prepared_file: data_extract_cell.mat
      prepared_file_public_link_status: unavailable
      paper_subject_count: 18
      status: blocked_external
    benchmark_preprocessing:
      sfreq_hz: 200
      filter_hz: [1.0, 50.0]
      filter_implementation: AASR_datafiltering2_FFT
      crop_s: [2.0, 26.0]
      duplicated_segment_s: 48.0
      constructed_stream_s: 240.0
      update_window_s: 20.0
      cutoff: 20
    benchmark_scoring_channels:
      eog: [Fp1, Fp2, F3, F4]
      emg: [T3, T4, T5, T6]
    benchmark_endpoints: [channelwise_rmse, channelwise_snr_db, correlation]
    bci_arms:
