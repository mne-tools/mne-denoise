        aggregate_sha256: 65059439c326e52c7ad1a7d770448baa1000bd245b7bfdba08a8f7420b4fb2bf
        per_subject_csv_sha256: 0269f6c7de6d0255afee656937a026f4c9ac38167afebd5b5ad8938fe1ec4de2
      outcome: published_cutoff_10_psw_gain_not_reproduced_on_public_halt_cohort
    evidence:
      algorithm: exact_numerical
      public_demo_protocol: procedural
      published_benchmark_result: blocked_external
      public_motor_imagery_result: procedural

  kim_2025:
    citation:
      doi: 10.1016/j.jneumeth.2025.110465
      title: Juggler's ASR - Unpacking the principles of Artifact Subspace Reconstruction for revision toward extreme MoBI
    implementations: [standard, juggler_dbscan, juggler_gev]
    source_oracle:
      public_code: false
      status: blocked_external
    empirical_data:
      description: 13 participants, 205-channel three-ball juggling EEG
      public: false
      status: blocked_external
    simulation:
      channels: 100
      samples: 100000
      sfreq_hz: 256
      background: pink_noise
      cross_channel_correlation: 0.2
      oscillation_hz: 10
      artifact_intervals_s: [0.1, 0.15, 0.2, 0.25, 0.3]
      cutoffs: [3, 5, 10, 20, 30]
      blocksize: 10
    reference_selection:
      filter: ASR_preemphasis_IIR
      dbscan:
        features: five_largest_absolute_channel_amplitudes_per_sample
        metric: chebyshev
        epsilon: one_tenth_of_mode
        minimum_neighbors: ten_percent_of_clean_samples
      gev:
        feature: maximum_absolute_channel_amplitude_per_sample
        clean_rule: left_tail_through_fitted_mode
    post_asr_window_rejection:
      z_tolerances: [-3.5, 5.0]
      retained_bad_channels: 0
    public_ssvep:
      participants: 10
      remove_channels: [M1, M2, CB1, CB2]
      sfreq_hz: 125
      cutoff: 5
      frequencies_hz: [12, 40]
      signal_channel: Oz
      blink_noise_channel: Fz
      endpoint: delta_snr_db
    evidence:
      published_algorithm_description: procedural
      simulation: procedural
      public_ssvep: procedural
      empirical_juggling: blocked_external

execution_policy:
  tuning_split: development_only
  held_out_split: locked_until_protocol_hash
  inferential_units: [participant, recording, simulation_seed]
  required_outputs:
    - terminal_status
    - package_commit
    - dirty_state
    - config_hash
    - environment_hash
    - dataset_version
    - dataset_manifest_hash
    - method_parameters
    - runtime_seconds
    - peak_memory_mb
    - effective_rank
    - warnings
    - failures
    - exclusions
    - attenuation_endpoint
    - preservation_endpoint
