      - {name: rsvp, participants: 14, filter_hz: [1.0, 50.0], endpoint: leave_one_session_out_accuracy}
      - {name: motor_imagery, participants: 13, filter_hz: [8.0, 50.0], endpoint: tenfold_svm_accuracy}
