protocol_id: asr_paper_replications_v1
scope: principal_algorithm_and_validation_papers
status_vocabulary:
  exact_numerical: same executable reference and fixture with declared tolerance
  algorithmic: same published algorithmic stages with equivalence judged on the
    appropriate state, waveform, or subspace invariant
  verification_required: implementation exists, but its external oracle has not
    yet passed the frozen parity gate
  procedural: same public data, preprocessing, method parameters, and endpoints
  result_pattern: original data unavailable; reproduce the declared direction and regime
  blocked_external: required data or code is not publicly obtainable

implementations:
  standard:
    symbol: mne_denoise.asr.ASR
    parameters: {method: standard}
  riemannian_windowed:
    symbol: mne_denoise.asr.ASR
    parameters: {method: riemannian_windowed}
  riemannian_legacy:
    symbol: mne_denoise.asr.ASR
    parameters: {method: riemannian, experimental: true}
  adaptive_psp:
    symbol: mne_denoise.asr.AdaptiveASR
    parameters: {variant: psp}
  adaptive_psw:
    symbol: mne_denoise.asr.AdaptiveASR
    parameters: {variant: psw}
  adaptive_mw_final_state:
    symbol: mne_denoise.asr.AdaptiveASR
    parameters: {variant: mw, mw_mode: final_state}
  adaptive_mw_sliding:
    symbol: mne_denoise.asr.AdaptiveASR
    parameters: {variant: mw, mw_mode: sliding}
  juggler_dbscan:
    symbol: mne_denoise.asr.JugglerASR
    parameters: {strategy: dbscan, blocksize: 10}
  juggler_gev:
    symbol: mne_denoise.asr.JugglerASR
    parameters: {strategy: gev, blocksize: 10}
  guided:
    symbol: mne_denoise.asr.GuidedASR

