[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling >= 1.27"]

[project]
name = "mne-denoise"
dynamic = ["version"]
description = "Artifact removal and signal denoising for EEG and MEG."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Sina Esmaeili", email = "sina.esmaeili@umontreal.ca" },
  { name = "Hamza Abdelhedi", email = "hamza.abdelhedi@umontreal.ca" },
]
maintainers = [
  { name = "Sina Esmaeili", email = "sina.esmaeili@umontreal.ca" },
  { name = "Hamza Abdelhedi", email = "hamza.abdelhedi@umontreal.ca" },
]
keywords = [
  "artifact-removal",
  "asr",
  "denoising",
  "dss",
  "eeg",
  "meg",
  "mne",
  "neuroscience",
  "signal-processing",
  "zapline",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.17.1",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.urls]
"Bug Tracker" = "https://github.com/mne-tools/mne-denoise/issues"
Changelog = "https://github.com/mne-tools/mne-denoise/blob/main/CHANGELOG.md"
Documentation = "https://mne.tools/mne-denoise/"
Homepage = "https://mne.tools/mne-denoise/"
"Source Code" = "https://github.com/mne-tools/mne-denoise"

[project.optional-dependencies]
mne = [
  "mne>=1.12.1",
]
progress = [
  "tqdm>=4.66",
]
viz = [
  "matplotlib>=3.11.1",
]

[dependency-groups]
lockfile_extras = [
  "mne>=1.12.1",
  "matplotlib>=3.11.1",
  "tqdm>=4.66",
]

test = [
  "pytest>=7.4.0",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.2.0",
  "pandas>=3.0.5",
  "seaborn>=0.12",
  { include-group = "lockfile_extras" },
]

doc = [
  "mne>=1.12.1",
  "matplotlib>=3.11.1",
  "numpydoc>=1.6.0",
  "pydata-sphinx-theme>=0.15.2",
  "sphinx>=7.2.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.5.0",
  "sphinx-gallery>=0.21.0",
  "myst-parser>=2.0.0",
]
build = [
  "build>=1.0.0",
  "packaging",
  "twine>=5.0.0",
]

lint = [
  "prek>=0.5",
  "spin>=0.18",
]

changelog = [
  "towncrier",
]

dev = [
  "pip>=26.2.1",
  { include-group = "test" },
  { include-group = "doc" },
  { include-group = "build" },
  { include-group = "lint" },
  { include-group = "changelog" },
]

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # isort
  "W",      # pycodestyle warnings
  "D",      # pydocstyle
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "E731",   # lambda assignment
  "D100",   # missing docstring in public module
  "D104",   # missing docstring in public package
  "D105",   # missing docstring in magic method
  "D107",   # missing docstring in __init__
  "D203",   # one-blank-line-before-class (conflicts with D211)
  "D212",   # multi-line-summary-first-line (conflicts with D213)
  "B905",   # zip without strict= argument
  "SIM108", # use ternary operator
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D", "B", "SIM", "E402"]
"examples/**" = ["D", "E402", "B", "F404"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  # Matplotlib 3.8 calls pyparsing's deprecated parser during import.
  "ignore:^'[^']+' deprecated - use '[^']+'$:pyparsing.warnings.PyparsingDeprecationWarning:matplotlib\\._(fontconfig_pattern|mathtext)",
  "ignore:.*argument is deprecated.*:pyparsing.warnings.PyparsingDeprecationWarning:matplotlib\\._(fontconfig_pattern|mathtext)",
  # pyparsing's parseAll warning reports its own helper as the source.
  "ignore:.*argument is deprecated.*:pyparsing.warnings.PyparsingDeprecationWarning:pyparsing\\.util",
  # Seaborn 0.12 reaches NumPy's deprecated compatibility helper.
  "ignore:^np\\.find_common_type is deprecated\\.:DeprecationWarning:pandas\\.core\\.algorithms",
]

[tool.coverage.run]
branch = true
source = ["mne_denoise"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.codespell]
skip = "*.html,*.css,*.js,*.svg,*.lock,.git,__pycache__,*.egg-info,build,dist,docs/_build,*.map"
ignore-words-list = "nd,ot,fro,sems,pre-select,Disjointness"

[tool.towncrier]
package = "mne_denoise"
filename = "CHANGELOG.md"
directory = "docs/changes/devel/"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/mne-tools/mne-denoise/issues/{issue})"
template = "docs/changes/template.jinja"
underlines = ["", "", ""]

[tool.changelog-bot]

[tool.changelog-bot.towncrier_changelog]
enabled = true
verify_pr_number = true
changelog_skip_label = "no-changelog-entry-needed"

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Internal"
showcontent = true

[tool.spin]
package = "mne_denoise"

[tool.spin.commands]
"Development" = [
  ".spin/cmds.py:test",
  ".spin/cmds.py:lint",
  ".spin/cmds.py:docs",
  ".spin/cmds.py:build",
  ".spin/cmds.py:check",
]
