name: Docs

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to migrate, for example v0.0.1"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-stable:
    name: Docs / MNE stable
    env:
      MNE_DATA: ${{ github.workspace }}/.mne-data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          if grep -q '^\[dependency-groups\]' pyproject.toml; then
            python -m pip install -e . --group doc
          else
            python -m pip install -e ".[docs]"
          fi
      - name: Display MNE and package versions
        run: |
          python - <<'PY'
          import mne
          import mne_denoise

          print("MNE:", mne.__version__)
          print("mne-denoise:", mne_denoise.__version__)
          PY
      - name: Check installed requirements
        run: python -m pip check
      - name: Restore documentation datasets
        id: docs-data-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.MNE_DATA }}
          key: docs-data-${{ runner.os }}-${{ hashFiles('scripts/prefetch_docs_data.py', 'pyproject.toml') }}
          restore-keys: |
            docs-data-${{ runner.os }}-
      - name: Prefetch and verify documentation datasets
        run: |
          if test -f scripts/prefetch_docs_data.py; then
            python scripts/prefetch_docs_data.py --data-dir "$MNE_DATA"
          else
            echo "No documentation prefetch helper in this release"
          fi
      - name: Save trusted documentation dataset cache
        if: >-
          steps.docs-data-cache.outputs.cache-hit != 'true' &&
          hashFiles('scripts/prefetch_docs_data.py') != '' &&
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           github.event_name == 'release' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.MNE_DATA }}
          key: docs-data-${{ runner.os }}-${{ hashFiles('scripts/prefetch_docs_data.py', 'pyproject.toml') }}
      - name: Build documentation
        run: make -C docs html
      - name: Add .nojekyll to the build
        run: touch docs/_build/html/.nojekyll
      - name: Verify the build produced a complete site
        run: |
          set -e
          test -s docs/_build/html/index.html
          test -s docs/_build/html/api.html
          test -s docs/_build/html/auto_examples/index.html
          echo "$(find docs/_build/html -name '*.html' | wc -l) HTML pages built"
      - name: Upload MNE-stable documentation artifact
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.release_tag == '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-html-mne-stable
          path: docs/_build/html/
          if-no-files-found: error
      - name: Upload release documentation artifact
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-html-release
          path: docs/_build/html/
          if-no-files-found: error

  docs-main:
    name: Docs / MNE main compatibility
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.release_tag == '')
    env:
      MNE_DATA: ${{ github.workspace }}/.mne-data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group doc
          python -c "import mne; print(mne.__version__)" > "$RUNNER_TEMP/docs-mne-stable-version"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mne-tools/mne-python
          path: .ci/mne-python
          fetch-depth: 0
          persist-credentials: false
      - name: Install MNE-Python main
        run: python -m pip install --upgrade ./.ci/mne-python
      - name: Display MNE-Python main information
        run: |
          echo "MNE git SHA: $(git -C .ci/mne-python rev-parse HEAD)"
          python - <<'PY'
          import os
          from importlib.metadata import version

          import mne
          import mne_denoise

          stable_version = open(
              os.path.join(os.environ["RUNNER_TEMP"], "docs-mne-stable-version"),
              encoding="utf-8",
          ).read().strip()
          print("MNE:", mne.__version__)
          print("MNE metadata:", version("mne"))
          print("MNE path:", mne.__file__)
          print("mne-denoise:", mne_denoise.__version__)
          if mne.__version__ == stable_version:
              raise SystemExit("MNE main installation did not replace stable MNE")
          PY
      - name: Restore documentation datasets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.MNE_DATA }}
          key: docs-data-${{ runner.os }}-${{ hashFiles('scripts/prefetch_docs_data.py', 'pyproject.toml') }}
          restore-keys: |
            docs-data-${{ runner.os }}-
      - name: Prefetch and verify documentation datasets
        run: |
          if test -f scripts/prefetch_docs_data.py; then
            python scripts/prefetch_docs_data.py --data-dir "$MNE_DATA"
          else
            echo "No documentation prefetch helper in this release"
          fi
      - name: Check installed requirements
        run: python -m pip check
      - name: Build compatibility documentation
        run: make -C docs html
      - name: Add .nojekyll to the build
        run: touch docs/_build/html/.nojekyll
      - name: Verify the build produced a complete site
        run: |
          set -e
          test -s docs/_build/html/index.html
          test -s docs/_build/html/api.html
          test -s docs/_build/html/auto_examples/index.html
          echo "$(find docs/_build/html -name '*.html' | wc -l) HTML pages built"
      - name: Upload MNE-main compatibility artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-html-mne-main
          path: docs/_build/html/
          if-no-files-found: error

  deploy-development:
    name: Deploy development docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs-stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download development documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docs-html-mne-stable
          path: site-build
      - name: Checkout publishing helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: .pages
          fetch-depth: 0
          persist-credentials: false
      - name: Update development directory
        run: python source/tools/publish_docs.py --pages .pages --build site-build --target dev
      - name: Commit and publish development docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C .pages config user.name "github-actions[bot]"
          git -C .pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .pages add --all -- dev index.html .nojekyll
          if git -C .pages diff --cached --quiet; then
            echo "Development documentation is already up to date"
          else
            git -C .pages commit -m "Deploy development documentation"
            git -C .pages -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" push origin gh-pages
          fi

  deploy-release:
    name: Deploy release docs
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: docs-stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: docs-html-release
          path: site-build
      - name: Checkout publishing helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v0.0.1' && 'main' || github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
          path: source
          persist-credentials: false
      - name: Checkout Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: .pages
          fetch-depth: 0
          persist-credentials: false
      - name: Update release and stable directories
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          MIGRATE_LEGACY_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v0.0.1' }}
        run: |
          set -euo pipefail
          publish_args=(
            --pages .pages
            --build site-build
            --target release
            --version "$RELEASE_TAG"
          )
          if [ "$MIGRATE_LEGACY_ROOT" = "true" ]; then
            publish_args+=(--migrate-legacy-root)
          fi
          python source/tools/publish_docs.py "${publish_args[@]}"
      - name: Commit and publish release docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          MIGRATE_LEGACY_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v0.0.1' }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          git -C .pages config user.name "github-actions[bot]"
          git -C .pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MIGRATE_LEGACY_ROOT" = "true" ]; then
            git -C .pages add --all
          else
            git -C .pages add --all -- index.html .nojekyll
            for directory in dev stable "$release_version"; do
              if [ -e ".pages/$directory" ]; then
                git -C .pages add --all -- "$directory"
              fi
            done
          fi
          if git -C .pages diff --cached --quiet; then
            echo "Release documentation is already up to date"
          else
            git -C .pages commit -m "Deploy release documentation"
            git -C .pages -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" push origin gh-pages
          fi
