name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Keep the trusted documentation dataset cache warm.
    - cron: "17 5 * * 1,4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pre-commit
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .
      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: "Test (py${{ matrix.python-version }}, ${{ matrix.os }})"
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run tests
        run: pytest --cov=mne_denoise --cov-report=xml -v
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  array-only-smoke:
    name: Array-only smoke
    runs-on: ubuntu-latest
    env:
      ARRAY_ENV: ${{ runner.temp }}/mne-denoise-array-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create clean environment
        run: python -m venv "$ARRAY_ENV"
      - name: Install base package
        run: |
          "$ARRAY_ENV/bin/python" -m pip install --upgrade pip
          "$ARRAY_ENV/bin/pip" install -e .
      - name: Run array-only smoke
        run: |
          "$ARRAY_ENV/bin/python" - <<'PY'
          from importlib.util import find_spec

          optional = ("mne", "matplotlib", "tqdm", "pandas", "seaborn")
          for name in optional:
              assert find_spec(name) is None, f"{name} leaked into the base environment"

          import numpy as np

          import mne_denoise
          from mne_denoise import compute_covariance
          from mne_denoise.dss import compute_dss
          from mne_denoise.icanclean import ICanClean
          from mne_denoise.sns import compute_sns
          from mne_denoise.sound import compute_sound
          from mne_denoise.spectrum_interpolation import interpolate_spectrum
          from mne_denoise.ssa import compute_basic_ssa

          assert mne_denoise.__version__ == "0.0.1"
          assert ICanClean is not None

          rng = np.random.default_rng(0)
          data = rng.standard_normal((4, 128))
          leadfield = rng.standard_normal((4, 6))
          leadfield -= leadfield.mean(axis=0, keepdims=True)

          covariance = compute_covariance(data)
          filters, patterns, eigenvalues = compute_dss(
              covariance,
              np.diag([4.0, 3.0, 2.0, 1.0]),
              n_components=2,
          )
          assert filters.shape == (2, 4)
          assert patterns.shape == (4, 2)
          assert eigenvalues.shape == (2,)
          compute_sns(data, n_neighbors=2)
          sound_operator, sigmas, convergence = compute_sound(
              data, leadfield, n_iter=1, random_state=0
          )
          assert sound_operator.shape == (4, 4)
          assert sigmas.shape == (4,)
          assert convergence.shape == (1,)
          assert interpolate_spectrum(data, 256.0, [60.0]).shape == data.shape
          cleaned_ssa, _ = compute_basic_ssa(data, 256.0, window_length=8)
          assert cleaned_ssa.shape == data.shape

          from mne_denoise._mne import require_mne
          from mne_denoise.progress import TqdmProgress

          try:
              require_mne("MNE smoke")
          except ImportError as error:
              assert 'mne-denoise[mne]' in str(error)
          else:
              raise AssertionError("MNE unexpectedly available in the base environment")

          try:
              import mne_denoise.viz
          except ImportError as error:
              assert 'mne-denoise[viz]' in str(error)
          else:
              raise AssertionError("viz unexpectedly available in the base environment")

          try:
              TqdmProgress(disable=True)
          except ImportError as error:
              assert 'mne-denoise[progress]' in str(error)
          else:
              raise AssertionError("tqdm unexpectedly available in the base environment")
          PY

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      MNE_DATA: ${{ github.workspace }}/.mne-data
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]
      - name: Restore documentation datasets
        id: docs-data-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MNE_DATA }}
          key: docs-data-${{ runner.os }}-${{ hashFiles('scripts/prefetch_docs_data.py', 'pyproject.toml') }}
          restore-keys: |
            docs-data-${{ runner.os }}-
      - name: Prefetch and verify documentation datasets
        run: python scripts/prefetch_docs_data.py --data-dir "$MNE_DATA"
      - name: Save trusted documentation dataset cache
        if: >-
          steps.docs-data-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MNE_DATA }}
          key: docs-data-${{ runner.os }}-${{ hashFiles('scripts/prefetch_docs_data.py', 'pyproject.toml') }}
      - name: Build documentation
        run: make -C docs html SPHINXOPTS="-W --keep-going"
      - name: Add .nojekyll to the build
        run: touch docs/_build/html/.nojekyll
      - name: Verify the build produced a complete site
        run: |
          set -e
          test -s docs/_build/html/index.html
          test -s docs/_build/html/auto_examples/index.html
          test -s docs/_build/html/auto_examples/zapline/plot_02_parameter_tuning.html
          test -s docs/_build/html/auto_examples/zapline/plot_03_epoched_data.html
          echo "$(find docs/_build/html -name '*.html' | wc -l) HTML pages built"
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/_build/html/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html/
          force_orphan: true
